<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LLMverse{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --bg-card: #12121a;
            --bg-hover: #1a1a25;
            --border: #2a2a3a;
            --text-primary: #e0e0e0;
            --text-secondary: #888;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Subtle grid background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(99, 102, 241, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 102, 241, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: -1;
        }
        
        /* Navigation */
        .nav-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 24px;
            z-index: 1000;
        }
        
        .nav-logo {
            font-family: 'Space Mono', monospace;
            font-size: 20px;
            font-weight: 700;
            color: var(--accent);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .nav-logo span {
            color: var(--text-primary);
        }
        
        .nav-links {
            display: flex;
            gap: 8px;
            margin-left: 40px;
        }
        
        .nav-link {
            padding: 8px 16px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        
        .nav-link:hover, .nav-link.active {
            color: var(--text-primary);
            background: var(--bg-hover);
        }
        
        .nav-link.active {
            color: var(--accent);
        }
        
        .nav-status {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
        }
        
        .status-dot.offline {
            background: var(--danger);
            box-shadow: 0 0 10px var(--danger);
        }
        
        /* Main content */
        .main-content {
            padding-top: 80px;
            padding-bottom: 40px;
            min-height: 100vh;
        }
        
        /* Cards */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
        }
        
        .card-header {
            font-family: 'Space Mono', monospace;
            font-size: 14px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* Buttons */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: var(--accent);
            color: white;
        }
        
        .btn-primary:hover {
            background: #5558e3;
            box-shadow: 0 0 20px var(--accent-glow);
        }
        
        .btn-secondary {
            background: var(--bg-hover);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        
        .btn-secondary:hover {
            border-color: var(--accent);
        }
        
        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
        }
        
        .btn-ghost:hover {
            color: var(--text-primary);
        }
        
        /* Inputs */
        .input, .textarea, .select {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        
        .input:focus, .textarea:focus, .select:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        .textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .input-label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        /* Avatar picker */
        .avatar-picker {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .avatar-option {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: var(--bg-dark);
            border: 2px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .avatar-option:hover {
            border-color: var(--text-secondary);
        }
        
        .avatar-option.selected {
            border-color: var(--accent);
            background: var(--accent-glow);
        }
        
        /* Character card */
        .character-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            gap: 16px;
            align-items: flex-start;
            transition: all 0.2s;
        }
        
        .character-card:hover {
            border-color: var(--accent);
            box-shadow: 0 0 30px var(--accent-glow);
        }
        
        .character-avatar {
            width: 60px;
            height: 60px;
            background: var(--bg-dark);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            flex-shrink: 0;
        }
        
        .character-info {
            flex: 1;
            min-width: 0;
        }
        
        .character-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .character-personality {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .character-meta {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }
        
        .character-tag {
            font-size: 11px;
            padding: 4px 8px;
            background: var(--bg-dark);
            border-radius: 4px;
            color: var(--text-secondary);
        }
        
        /* Trait bars */
        .trait-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        
        .trait-label {
            width: 100px;
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .trait-track {
            flex: 1;
            height: 6px;
            background: var(--bg-dark);
            border-radius: 3px;
            overflow: hidden;
        }
        
        .trait-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 3px;
            transition: width 0.3s;
        }
        
        .trait-value {
            width: 30px;
            font-size: 12px;
            color: var(--text-secondary);
            text-align: right;
        }
        
        /* Toast notifications */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 10000;
        }
        
        .toast {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        /* Utility classes */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }
        
        .container-narrow {
            max-width: 800px;
        }
        
        .container-wide {
            max-width: 1600px;
        }
        
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .gap-2 { gap: 8px; }
        .gap-4 { gap: 16px; }
        .gap-6 { gap: 24px; }
        .mt-4 { margin-top: 16px; }
        .mt-6 { margin-top: 24px; }
        .mb-4 { margin-bottom: 16px; }
        .text-center { text-align: center; }
        .text-secondary { color: var(--text-secondary); }
        .text-sm { font-size: 13px; }
        .font-mono { font-family: 'Space Mono', monospace; }
        .hidden { display: none; }
        
        /* Grid layouts */
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }
        
        @media (max-width: 768px) {
            .grid-2, .grid-3 {
                grid-template-columns: 1fr;
            }
            .nav-links {
                display: none;
            }
        }
    </style>
</head>
<body>
    {% block nav %}
    <nav class="nav-bar">
        <a href="{{ url_for('welcome') }}" class="nav-logo">
            <i class="fas fa-globe"></i>
            <span>LLMverse</span>
        </a>
        
        <div class="nav-links">
            {% if simulation_started|default(false) %}
            <a href="{{ url_for('god_mode') }}" class="nav-link {% if request.endpoint == 'god_mode' %}active{% endif %}">
                <i class="fas fa-eye"></i> God Mode
            </a>
            <a href="{{ url_for('characters_page') }}" class="nav-link {% if request.endpoint == 'characters_page' %}active{% endif %}">
                <i class="fas fa-users"></i> Characters
            </a>
            {% endif %}
        </div>
        
        <div class="nav-status">
            <div class="status-dot" id="connection-dot"></div>
            <span class="text-sm text-secondary" id="connection-text">Connected</span>
        </div>
    </nav>
    {% endblock %}
    
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
    
    <div class="toast-container" id="toast-container"></div>
    
    <script>
        // Socket connection
        let socket;
        
        document.addEventListener('DOMContentLoaded', function() {
            socket = io();
            
            socket.on('connect', function() {
                document.getElementById('connection-dot').classList.remove('offline');
                document.getElementById('connection-text').textContent = 'Connected';
            });
            
            socket.on('disconnect', function() {
                document.getElementById('connection-dot').classList.add('offline');
                document.getElementById('connection-text').textContent = 'Disconnected';
            });
        });
        
        // Toast function
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            
            const icons = {
                success: '✓',
                error: '✗',
                info: 'ℹ',
                warning: '⚠'
            };
            
            toast.innerHTML = `<span>${icons[type] || icons.info}</span> ${message}`;
            container.appendChild(toast);
            
            setTimeout(() => toast.remove(), 4000);
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
