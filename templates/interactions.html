{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="fas fa-comments"></i> Agent Interactions</h5>
                <div class="interaction-controls">
                    <button class="btn btn-sm btn-outline-secondary" id="refreshInteractions">
                        <i class="fas fa-sync"></i> Refresh
                    </button>
                    <button class="btn btn-sm btn-outline-danger" id="clearInteractions">
                        <i class="fas fa-trash"></i> Clear All
                    </button>
                </div>
            </div>
            <div class="card-body">
                <div class="interaction-filters mb-3">
                    <div class="row">
                        <div class="col-md-3">
                            <select class="form-select form-select-sm" id="categoryFilter">
                                <option value="">All Categories</option>
                                <option value="general">General</option>
                                <option value="politics">Politics</option>
                                <option value="education">Education</option>
                                <option value="social">Social</option>
                                <option value="philosophy">Philosophy</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <select class="form-select form-select-sm" id="agentFilter">
                                <option value="">All Participants</option>
                                <!-- Will be populated by JavaScript -->
                            </select>
                        </div>
                        <div class="col-md-3">
                            <input type="number" class="form-control form-control-sm" id="limitFilter" value="50"
                                min="10" max="500" placeholder="Limit">
                        </div>
                        <div class="col-md-3">
                            <button class="btn btn-sm btn-primary" id="applyFilters">
                                <i class="fas fa-filter"></i> Apply Filters
                            </button>
                        </div>
                    </div>
                </div>

                <div id="interactionsContainer">
                    <!-- Will be populated by JavaScript -->
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let allInteractions = [];
    let filteredInteractions = [];

    document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('refreshInteractions').addEventListener('click', loadInteractions);
        document.getElementById('clearInteractions').addEventListener('click', clearAllInteractions);
        document.getElementById('applyFilters').addEventListener('click', applyFilters);

        loadInteractions();
        loadAgentList();

        startAutoRefresh(loadInteractions, 15000);
        window.resumeAutoRefresh = function () {
            startAutoRefresh(loadInteractions, 15000);
        };
    });

    function loadInteractions() {
        const limit = document.getElementById('limitFilter').value || 50;

        showLoading('interactionsContainer');

        fetch(`/api/interactions?limit=${limit}`)
            .then(response => response.json())
            .then(data => {
                allInteractions = data;
                filteredInteractions = data;
                renderInteractions(filteredInteractions);
            })
            .catch(error => {
                hideLoading('interactionsContainer',
                    '<div class="alert alert-danger">Error loading interactions: ' + error.message + '</div>');
            });
    }

    function loadAgentList() {
        fetch('/api/agents')
            .then(response => response.json())
            .then(data => {
                const agentFilter = document.getElementById('agentFilter');
                while (agentFilter.children.length > 1) {
                    agentFilter.removeChild(agentFilter.lastChild);
                }
                data.forEach(agent => {
                    const option = document.createElement('option');
                    option.value = agent.name;
                    option.textContent = agent.name;
                    agentFilter.appendChild(option);
                });
                // Also add a "Human" option for user posts
                const humanOpt = document.createElement('option');
                humanOpt.value = '__human__';
                humanOpt.textContent = '👤 Human posts';
                agentFilter.appendChild(humanOpt);
            })
            .catch(error => console.error('Error loading agents:', error));
    }

    function renderInteractions(interactions) {
        const container = document.getElementById('interactionsContainer');

        if (!interactions || interactions.length === 0) {
            container.innerHTML = '<div class="alert alert-info"><i class="fas fa-info-circle"></i> No interactions yet. Start the simulation or post in the forum to see activity here.</div>';
            return;
        }

        let html = '<div class="timeline">';

        interactions.forEach((item, index) => {
            const time = item.created_at ? formatDate(item.created_at) : '';
            const isAgent = item.is_agent;
            const authorName = item.author_name || 'Unknown';
            const categoryColor = getCategoryColor(item.topic_category);
            const replyInfo = item.reply_to_author
                ? `<i class="fas fa-reply fa-xs"></i> replying to <strong>${escapeHtml(item.reply_to_author)}</strong>`
                : '';

            html += `
            <div class="timeline-item" data-index="${index}" data-category="${item.topic_category || ''}" data-author="${escapeHtml(authorName)}" data-is-agent="${isAgent}">
                <div class="timeline-marker" style="background: ${isAgent ? '#6f42c1' : '#198754'};">
                    <i class="fas ${isAgent ? 'fa-robot' : 'fa-user'}"></i>
                </div>
                <div class="timeline-content">
                    <div class="timeline-header">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <strong>${escapeHtml(authorName)}</strong>
                                ${isAgent ? '<span class="badge bg-purple-subtle text-purple ms-1" style="background:#6f42c120!important;color:#6f42c1!important;">AI</span>' : '<span class="badge bg-success-subtle text-success ms-1" style="background:#19875420!important;color:#198754!important;">Human</span>'}
                                <a href="/forum/${item.topic_id}" class="badge bg-${categoryColor} ms-1 text-decoration-none">
                                    ${escapeHtml(item.topic_title || 'Unknown Topic')}
                                </a>
                                <span class="badge bg-light text-muted border ms-1">${item.topic_category || 'general'}</span>
                            </div>
                            <small class="text-muted">${time}</small>
                        </div>
                        ${replyInfo ? `<small class="text-muted">${replyInfo}</small>` : ''}
                    </div>
                    <div class="timeline-body mt-2">
                        <p class="mb-0">${escapeHtml(item.content)}</p>
                    </div>
                </div>
            </div>
            `;
        });

        html += '</div>';
        container.innerHTML = html;
    }

    function applyFilters() {
        const categoryFilter = document.getElementById('categoryFilter').value;
        const agentFilter = document.getElementById('agentFilter').value;

        filteredInteractions = allInteractions.filter(item => {
            if (categoryFilter && item.topic_category !== categoryFilter) {
                return false;
            }
            if (agentFilter) {
                if (agentFilter === '__human__') {
                    if (item.is_agent) return false;
                } else if (item.author_name !== agentFilter) {
                    return false;
                }
            }
            return true;
        });

        renderInteractions(filteredInteractions);
    }

    function clearAllInteractions() {
        if (confirm('Are you sure you want to clear all interactions? This action cannot be undone.')) {
            fetch('/api/environment/reset', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        showToast('Error clearing interactions: ' + data.error, 'error');
                    } else {
                        showToast('All interactions cleared', 'success');
                        loadInteractions();
                    }
                })
                .catch(error => {
                    showToast('Error clearing interactions: ' + error.message, 'error');
                });
        }
    }

    function getCategoryColor(category) {
        switch (category) {
            case 'politics': return 'danger';
            case 'education': return 'info';
            case 'social': return 'warning';
            case 'philosophy': return 'secondary';
            case 'general': return 'primary';
            default: return 'primary';
        }
    }
</script>

<style>
    .timeline {
        position: relative;
        padding-left: 3rem;
    }

    .timeline::before {
        content: '';
        position: absolute;
        left: 1rem;
        top: 0;
        bottom: 0;
        width: 2px;
        background: #dee2e6;
    }

    .timeline-item {
        position: relative;
        margin-bottom: 2rem;
    }

    .timeline-marker {
        position: absolute;
        left: -2.5rem;
        top: 0.5rem;
        width: 2rem;
        height: 2rem;
        background: #007bff;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 0.75rem;
    }

    .timeline-item.failed .timeline-marker {
        background: #dc3545;
    }

    .timeline-content {
        background: white;
        border: 1px solid #dee2e6;
        border-radius: 0.375rem;
        padding: 1rem;
        box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
    }

    .timeline-header {
        margin-bottom: 0.5rem;
    }

    .timeline-body {
        margin: 0;
    }

    .metadata-content pre {
        font-size: 0.75rem;
        max-height: 200px;
        overflow: auto;
    }
</style>
{% endblock %}
